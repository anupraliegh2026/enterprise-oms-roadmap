<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Enterprise OMS Roadmap Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    margin:20px;
}

h1{
    color:#d71920;
}

.toolbar{
    margin-bottom:20px;
}

#searchBox{
    padding:8px;
    width:300px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#d71920;
    color:white;
    padding:10px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.ready{
    background:#d4edda;
    padding:4px 8px;
    border-radius:12px;
}

.progress{
    background:#fff3cd;
    padding:4px 8px;
    border-radius:12px;
}

.discovery{
    background:#e2e3e5;
    padding:4px 8px;
    border-radius:12px;
}
</style>

</head>
<body>

<h1>Enterprise OMS Roadmap Dashboard</h1>

<div class="toolbar">
    <input
        id="searchBox"
        placeholder="Search..."
        onkeyup="filterRows()">
</div>

<table>

<thead>
<tr>
    <th>Capability ID</th>
    <th>L1 Domain</th>
    <th>L2 Capability Group</th>
    <th>L3 Capability</th>
    <th>Epic #</th>
    <th>Status</th>
</tr>
</thead>

<tbody id="roadmapTable">
</tbody>

</table>

    if(status==="Ready"){
        return '<span class="ready">Ready</span>';

    return '<span class="discovery">Discovery</span>';

}
