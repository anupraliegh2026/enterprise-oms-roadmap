<!DOCTYPE html>
<html>
<head>
    <title>Enterprise OMS Roadmap Dashboard</title>

    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 30px;
        }

        h1 {
            color: #d71920;
            margin-bottom: 20px;
        }

        .toolbar {
            margin-bottom: 20px;
        }

        #searchBox {
            width: 350px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #d71920;
            color: white;
            text-align: left;
            padding: 12px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        a {
            color: #0056b3;
            text-decoration: none;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .ready {
            background: #d4edda;
        }

        .progress {
            background: #fff3cd;
        }

        .discovery {
            background: #e2e3e5;
        }
    </style>
</head>

<body>

<h1>Enterprise OMS Roadmap Dashboard</h1>

<div class="toolbar">
    <input
        type="text"
        id="searchBox"
        placeholder="Search capability, Epic or Capability ID..."
        onkeyup="filterRows()">
</div>

<div class="card">

<table>
    <thead>
        <tr>
            <th>Capability ID</th>
            <th>L3 Capability</th>
            <th>Epic #</th>
            <th>Readiness</th>
        </tr>
    </thead>

    <tbody id="roadmapTable">
    </tbody>

</table>

</div>

<script>

let roadmapData = [];

function readinessBadge(status) {

    const lower = status.toLowerCase();

    if (lower.includes("ready")) {
        return '<span class="badge ready">Ready</span>';
    }

    if (lower.includes("progress")) {
        return '<span class="badge progress">In Progress</span>';
    }

    return '<span class="badge discovery">Discovery</span>';
}

function renderTable(data) {

    const tbody =
        document.getElementById("roadmapTable");

    tbody.innerHTML = "";

    data.forEach(item => {

        tbody.innerHTML += `
            <tr>
                <td>${item.capabilityId}</td>
                <td>${item.capability}</td>
                <td>
                  <a href="${item.jiraUrl}" target="_blank">
                    ${item.epic}
                  </a>
                </td>
                <td>${readinessBadge(item.status)}</td>
            </tr>
        `;
    });
}

function filterRows() {

    const search =
        document
          .getElementById("searchBox")
          .value
          .toLowerCase();

    const filtered =
        roadmapData.filter(item =>
            item.capabilityId.toLowerCase().includes(search) ||
            item.capability.toLowerCase().includes(search) ||
            item.epic.toLowerCase().includes(search)
        );

    renderTable(filtered);
}

fetch("data.json")
.then(response => response.json())
.then(data => {
    roadmapData = data;
    renderTable(data);
})
.catch(error => {
    console.error(error);
});

</script>

</body>
</html>
