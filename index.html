<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enterprise OMS Roadmap Dashboard</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    margin:20px;
}

h1{
    color:#d71920;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

select,input{
    padding:8px;
    border:1px solid #ccc;
    border-radius:5px;
}

input{
    min-width:300px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#d71920;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f1f1f1;
}

.badge{
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.ready{
    background:#d4edda;
}

.progress{
    background:#fff3cd;
}

.discovery{
    background:#e2e3e5;
}

a{
    color:#0056b3;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>

<body>

<h1>Enterprise OMS Roadmap Dashboard</h1>

<div class="toolbar">

<select id="domainFilter">
<option value="">All Domains</option>
</select>

<select id="groupFilter">
<option value="">All Capability Groups</option>
</select>

<select id="priorityFilter">
<option value="">All Priorities</option>
</select>

<select id="waveFilter">
<option value="">All Waves</option>
</select>

<input
id="searchBox"
type="text"
placeholder="Search..."
>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>Capability ID</th>
<th>L1 Domain</th>
<th>L2 Capability Group</th>
<th>L3 Capability</th>
<th>Priority</th>
<th>Wave</th>
