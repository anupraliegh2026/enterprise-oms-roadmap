<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Enterprise OMS Roadmap Dashboard</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#f5f7fa;
}

h1{
    color:#d71920;
}

.filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

select,input{
    padding:8px;
    border:1px solid #ccc;
    border-radius:4px;
}

input{
    min-width:250px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#d71920;
    color:white;
    padding:10px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.ready{
    background:#d4edda;
    padding:4px 8px;
    border-radius:12px;
}

.progress{
    background:#fff3cd;
    padding:4px 8px;
    border-radius:12px;
}

.discovery{
    background:#e2e3e5;
    padding:4px 8px;
    border-radius:12px;
}

a{
    color:#0056b3;
    font-weight:bold;
    text-decoration:none;
}

</style>

</head>

<body>

<h1>Enterprise OMS Roadmap Dashboard</h1>

<div class="filters">

<select id="domainFilter">
<option value="">All Domains</option>
</select>

<select id="groupFilter">
<option value="">All Groups</option>
</select>

<select id="priorityFilter">
<option value="">All Priorities</option>
</select>

<select id="waveFilter">
<option value="">All Waves</option>
</select>

<input
id="searchBox"
placeholder="Search..."
>

</div>

<table>

<thead>
<tr>
<th>Capability ID</th>
<th>L1 Domain</th>
<th>L2 Capability Group</th>
<th>L3 Capability</th>
<th>Priority</th>
<th>Wave</th>
<th>Owner</th>
<th>Epic #</th>
<th>Status</th>
</tr>
</thead>

<tbody id="roadmapTable">
</tbody>

</table>

<script>

let roadmapData = [];

function badge(status){

    if(!status){
        return "";
    }

    const value = status.toLowerCase();

    if(value.includes("ready")){
        return '<span class="ready">Ready</span>';
    }

    if(value.includes("progress")){
        return '<span class="progress">In Progress</span>';
    }

    return '<span class="discovery">Discovery</span>';
}

function render(rows){

    let html = "";

    rows.forEach(item => {

        html += `
        <tr>
            <td>${item["Capability ID"] || ""}</td>
            <td>${item["L1 Domain"] || ""}</td>
            <td>${item["L2 Capability Group"] || ""}</td>
            <td>${item["L3 Capability"] || ""}</td>
            <td>${item["Priority"] || ""}</td>
            <td>${item["Implementation Wave"] || ""}</td>
            <td>${item["Owner Name"] || ""}</td>
            <td>
                <a href="${item["Jira URL"] || "#"}" target="_blank">
                    ${item["Epic #"] || ""}
                </a>
            </td>
            <td>${badge(item["Readiness Category"])}</td>
        </tr>
        `;
    });

    document.getElementById("roadmapTable").innerHTML = html;
}

function addOptions(id,list){

    const ddl = document.getElementById(id);

    list.forEach(x => {

        let opt = document.createElement("option");
        opt.value = x;
        opt.text = x;

        ddl.appendChild(opt);

    });
}

function populateFilters(){

    addOptions(
        "domainFilter",
        [...new Set(roadmapData.map(x => x["L1 Domain"]).filter(Boolean))]
    );

    addOptions(
        "groupFilter",
        [...new Set(roadmapData.map(x => x["L2 Capability Group"]).filter(Boolean))]
    );

    addOptions(
        "priorityFilter",
        [...new Set(roadmapData.map(x => x["Priority"]).filter(Boolean))]
    );

    addOptions(
        "waveFilter",
        [...new Set(roadmapData.map(x => x["Implementation Wave"]).filter(Boolean))]
    );

}

function applyFilters(){

    const domain =
        document.getElementById("domainFilter").value;

    const group =
        document.getElementById("groupFilter").value;

    const priority =
        document.getElementById("priorityFilter").value;

    const wave =
        document.getElementById("waveFilter").value;

    const search =
        document.getElementById("searchBox")
        .value
        .toLowerCase();

    const filtered =
        roadmapData.filter(item =>

            (domain === "" || item["L1 Domain"] === domain)
            &&
            (group === "" || item["L2 Capability Group"] === group)
            &&
            (priority === "" || item["Priority"] === priority)
            &&
            (wave === "" || item["Implementation Wave"] === wave)
            &&
            (
                JSON.stringify(item)
                .toLowerCase()
                .includes(search)
            )

        );

    render(filtered);

}

async function loadCSV(){

    const response = await fetch(
        "https://raw.githubusercontent.com/anupraliegh2026/enterprise-oms-roadmap/refs/heads/main/Capability_Master.csv"
    );

    const csv = await response.text();

    const lines = csv.split("\n");

    const headers =
        lines[0]
        .split(",")
        .map(h => h.trim());

    const data = [];

    for(let i=1;i<lines.length;i++){

        if(!lines[i].trim()){
            continue;
        }

        const values = lines[i].split(",");

        const obj = {};

        headers.forEach((header,index)=>{

            obj[header] =
                values[index]
                ? values[index].replaceAll('"','').trim()
                : "";

        });

        data.push(obj);

    }

    roadmapData = data;

    populateFilters();

    render(data);

}

loadCSV();

document.addEventListener(
    "change",
    applyFilters
);

document
.getElementById("searchBox")
.addEventListener(
    "keyup",
    applyFilters
);

</script>
</body>
</html>
