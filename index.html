<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Enterprise OMS Roadmap Dashboard</title>

<style>
body{
    font-family:Arial, sans-serif;
    margin:20px;
    background:#f5f7fa;
}

h1{
    color:#d71920;
}

.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

select,input{
    padding:8px;
    border:1px solid #ccc;
    border-radius:4px;
}

input{
    min-width:300px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 4px rgba(0,0,0,.15);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#d71920;
    color:white;
    padding:10px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.badge{
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.ready{
    background:#d4edda;
}

.progress{
    background:#fff3cd;
}

.discovery{
    background:#e2e3e5;
}
</style>

</head>

<body>

<h1>Enterprise OMS Roadmap Dashboard</h1>

<div class="toolbar">

<select id="domainFilter">
    <option value="">All Domains</option>
</select>

<select id="groupFilter">
    <option value="">All Capability Groups</option>
</select>

<select id="priorityFilter">
    <option value="">All Priorities</option>
</select>

<select id="waveFilter">
    <option value="">All Waves</option>
</select>

<input
id="searchBox"
placeholder="Search..."
onkeyup="applyFilters()">

</div>

<div class="card">

<table>

<thead>
<tr>
<th>Capability ID</th>
<th>L1 Domain</th>
<th>L2 Capability Group</th>
<th>L3 Capability</th>
